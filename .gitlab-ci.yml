variables:
  RUST_VERSION: "1.100"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

stages:
  - check
  - test

default:
  image: rust:${RUST_VERSION}-bookworm
  before_script:
    - cargo --version

fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings

test:
  stage: test
  script:
    - cargo test

frontend:
  stage: check
  image: node:20-bookworm
  before_script: []
  script:
    - if [ -f package-lock.json ]; then npm ci; else npm install; fi
    - npm run typecheck
  only:
    changes:
      - "*.ts"
      - "*.tsx"
      - "package.json"
      - "tsconfig.json"
      - "src/**/*.ts"
      - "public/**"
