[package]
name = "seleniumbase-rs-web"
version = "0.10.0"
edition = "2024"
license = "MIT"
description = "Web front end and interactive automation studio for seleniumbase-rs."
repository = "https://github.com/MustCodeAl/seleniumbase-rs"
publish = false

[dependencies]
seleniumbase-rs = { git = "https://github.com/MustCodeAl/seleniumbase-rs", branch = "main", features = ["mcp-server", "test-util"] }
seleniumbase-rs-plugin-extractor = { git = "https://github.com/MustCodeAl/seleniumbase-rs-plugins", branch = "main" }
tokio = { version = "1.40", features = ["full"] }
actix-web = "4"
actix-files = "0.6"
actix-cors = "0.7"
rand = "0.8"
tsync = "3.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
